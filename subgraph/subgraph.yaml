specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProfileManager
    network: sepolia
    source:
      address: "0xb8fcd9a99a7c6d4cd6b30da141713034ce85d823" # ProfileManager deployed address
      abi: ProfileManager
      startBlock: 6900000 # Recent Sepolia block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Profile
        - Verification
      abis:
        - name: ProfileManager
          file: ./abis/ProfileManager.json
      eventHandlers:
        - event: ProfileVerified(indexed address,bool,bool,bool,string,uint256)
          handler: handleProfileVerified
      file: ./src/mapping.ts