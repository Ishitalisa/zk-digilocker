specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProfileManager
    network: sepolia
    source:
      address: "PROFILE_MANAGER_CONTRACT_ADDRESS" # UPDATE AFTER DEPLOYMENT
      abi: ProfileManager
      startBlock: 0 # UPDATE AFTER DEPLOYMENT
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Profile
        - Verification
      abis:
        - name: ProfileManager
          file: ./abis/ProfileManager.json
      eventHandlers:
        - event: ProfileVerified(indexed address,bool,bool,bool,string,uint256)
          handler: handleProfileVerified
      file: ./src/mapping.ts